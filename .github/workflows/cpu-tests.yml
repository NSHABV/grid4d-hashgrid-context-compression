name: Synthetic CPU checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-public.txt
      - run: python -m pip install -r requirements-public.txt
      - run: python -B scripts/check_results.py
      - run: python -B scripts/run_public_tests.py
